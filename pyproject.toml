[project]
name = "repo-fix-agent"
version = "0.1.0"
description = "Bug-fixing agent that plugs onto a repo, plus a teacher->student distillation pipeline"
requires-python = ">=3.10"
dependencies = ["pytest>=8"]

[project.optional-dependencies]
teacher = ["anthropic>=0.100"]
openai = ["openai>=1.100"]
embed = ["sentence-transformers>=3", "numpy>=1.26"]     # semantic retrieval + near-dup (st:MODEL)
voyage = ["voyageai>=0.3", "numpy>=1.26"]               # voyage:voyage-code-3 embeddings
secrets = ["detect-secrets>=1.5"]                       # audit --secret-scanner detect-secrets

[project.scripts]
repo-fix = "repo_fix_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
norecursedirs = ["data"]
